<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 370"
     width="1200"
     height="370">

  <defs>
    <style>
      .key {
        fill: #171d24;
        stroke: #343d47;
        stroke-width: 2;
      }
      .letter {
        fill: #ffffff;
        font: 16px monospace;
        text-anchor: middle;
      }
      .label {
        fill: #d5d9dc;
        font: 10px sans-serif;
        text-anchor: middle;
      }
    </style>
  </defs>

