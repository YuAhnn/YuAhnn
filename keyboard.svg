      <g transform="translate(456)">
        <rect class="key" width="70" height="48" rx="5"/>
        <text class="letter" x="35" y="20">6</text>
      </g>
      <g transform="translate(532)">
        <rect class="key" width="70" height="48" rx="5"/>
        <text class="letter" x="35" y="20">7</text>
      </g>
      <g transform="translate(608)">
