        <rect class="key" width="70" height="48" rx="5"/>
        <text class="letter" x="35" y="20">3</text>
      </g>
      <g transform="translate(304)">
        <rect class="key" width="70" height="48" rx="5"/>
        <text class="letter" x="35" y="20">4</text>
      </g>
      <g transform="translate(380)">
        <rect class="key" width="70" height="48" rx="5"/>
        <text class="letter" x="35" y="20">5</text>
